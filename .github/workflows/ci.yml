name: CI

# P20 / Q17：每次 push 与 PR 自动跑「能装、能类型检查、能 lint、能单测、能构建、能 UI 回归」。
# bench（P23）故意不进 CI：10k 合成仓以分钟计，本地/夜间用 `npm run bench` 跑（数字见 PR 说明）。
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # 只跑 Node 22：本仓库是本地工具，跑多版本矩阵会让 tree-sitter 原生模块的编译时间成倍增加，
    # 收益低于成本；需要更宽覆盖时再补 20 / 24。
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      # 三个 package-lock 各自独立：根装 lint/format 与 UI 回归工具，backend / frontend 走 install:all。
      # tree-sitter 原生模块在这里编译：ubuntu runner 自带的 python3 / make / g++ 够用。
      - name: Install (root)
        run: npm ci

      - name: Install (backend + frontend)
        run: npm run install:all

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # 仓库还没有做过一次性全量格式化（见 docs/06-platform-plan.md §9.3）；
      # 跑过 `npm run format` 之后请删掉 continue-on-error。
      - name: Format check
        continue-on-error: true
        run: npm run format:check

      - name: Backend tests
        run: npm run test

      - name: Frontend unit tests
        run: npm run test:unit

      - name: Build frontend
        run: npm run build

      - name: Install Chromium (UI regression)
        run: npx playwright install --with-deps chromium

      # findChromium() 已跨平台（Windows / Linux / macOS 的 playwright 缓存），这里装的 Chromium 找得到。
      - name: UI regression (Chromium)
        run: npm run test:ui
